</script>
<style>
:root{
  --bg:#F3F5F7;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --border:#E4E7EC;
  --border-strong:#D0D5DD;
  --text:#101828;
  --text-2:#475467;
  --text-3:#8A93A3;
  --primary:#0B5D52;
  --primary-light:#0F7A6C;
  --primary-dark:#08453D;
  --primary-darker:#062F2A;
  --primary-tint:#E6F2EF;
  --primary-tint-2:#D3E8E3;
  --amber:#96650F;
  --amber-light:#C4881A;
  --amber-tint:#FBF2DF;
  --receive:#15803D;
  --receive-tint:#EAF7EF;
  --pay:#B42318;
  --pay-tint:#FCEDEB;
  --balanced:#475467;
  --balanced-tint:#F0F1F3;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --radius-xl:20px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 14px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.05);
  --shadow-lg:0 16px 40px rgba(9,30,26,.14), 0 4px 12px rgba(16,24,40,.06);
  --shadow-glow:0 0 0 1px rgba(11,93,82,.06), 0 8px 24px rgba(11,93,82,.12);
  --ease:cubic-bezier(.22,.9,.32,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --sidebar-w:252px;
  --sidebar-w-collapsed:76px;
  --topbar-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:
    radial-gradient(1100px 560px at 100% -8%, rgba(11,93,82,.05), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;margin:0;color:var(--text);letter-spacing:-0.012em;}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#CBD2DD;border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:#AEB7C4;background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}
::selection{background:var(--primary-tint-2);color:var(--primary-darker);}
:focus-visible{outline:2px solid var(--primary-light);outline-offset:2px;border-radius:4px;}
:focus:not(:focus-visible){outline:none;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:var(--primary-darker);
  padding:24px;
}
.login-wrap::before,.login-wrap::after{
  content:'';position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;
}
.login-wrap::before{
  width:560px;height:560px;top:-18%;left:-10%;
  background:radial-gradient(circle, rgba(15,122,108,.35), transparent 70%);
  animation:orbFloat1 16s ease-in-out infinite;
}
.login-wrap::after{
  width:520px;height:520px;bottom:-20%;right:-8%;
  background:radial-gradient(circle, rgba(150,101,15,.22), transparent 70%);
  animation:orbFloat2 18s ease-in-out infinite;
}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,-25px)}}
.login-card{
  width:100%;max-width:960px;
  background:var(--surface);
  border-radius:22px;
  box-shadow:0 30px 80px rgba(3,15,13,.45), 0 2px 8px rgba(3,15,13,.2);
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
  position:relative;
  z-index:1;
  animation:loginIn .5s var(--ease) both;
}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-side{
  background:
    radial-gradient(560px 320px at 100% 0%, rgba(255,255,255,.06), transparent 60%),
    linear-gradient(165deg, var(--primary-dark), var(--primary-darker));
  color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;
}
.login-side .mark{
  width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:18px;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.1);
}
.login-side h1{color:#fff;font-size:28px;margin-top:28px;line-height:1.22;}
.login-side p{color:rgba(255,255,255,.68);margin-top:10px;font-size:14px;max-width:320px;}
.login-side .ledger{margin-top:auto;}
.ledger-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:rgba(255,255,255,.75);}
.ledger-row b{color:#fff;font-family:'JetBrains Mono';font-weight:500;}
.login-form{padding:48px 40px;display:flex;flex-direction:column;}
.login-form h2{font-size:20px;}
.login-form .sub{color:var(--text-2);font-size:13px;margin-top:6px;margin-bottom:26px;}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.user-card{
  border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;
  background:var(--surface-2);transition:all .18s var(--ease);text-align:left;
}
.user-card:hover{border-color:var(--primary);background:var(--primary-tint);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.user-card:active{transform:translateY(0);}
.user-avatar{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Manrope';font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(150deg, var(--primary-light), var(--primary));
  box-shadow:0 2px 6px rgba(11,93,82,.3);
}
.user-card.viewer .user-avatar{background:linear-gradient(150deg,#71809A,#5D6B82);box-shadow:0 2px 6px rgba(93,107,130,.3);}
.user-card b{font-size:13.5px;font-weight:600;}
.role-pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.02em;text-transform:uppercase;}
.role-pill.admin{background:var(--primary-tint);color:var(--primary-dark);}
.role-pill.viewer{background:#EEF1F4;color:#4B5565;}
.login-foot{margin-top:26px;font-size:11.5px;color:var(--text-3);line-height:1.6;}

/* ---------- App shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(190deg, var(--primary-darker), #051F1B);
  color:#fff;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;
  transition:width .2s var(--ease), transform .22s var(--ease);overflow:hidden;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sb-head{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.sb-head .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(150deg, var(--primary-light), var(--primary));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15);}
.sb-head .brand{font-family:'Manrope';font-weight:700;font-size:15px;white-space:nowrap;opacity:1;transition:opacity .15s;}
.sidebar.collapsed .brand,.sidebar.collapsed .sb-foot-text{opacity:0;width:0;pointer-events:none;}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.sb-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.36);padding:14px 10px 6px;font-weight:600;white-space:nowrap;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;
  color:rgba(255,255,255,.68);font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;
  transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
  position:relative;
}
.nav-item svg{flex-shrink:0;width:18px;height:18px;transition:transform .15s var(--ease);}
.nav-item span{overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item:hover svg{transform:translateX(1px);}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#3FBFAA,var(--primary-light));box-shadow:0 0 8px rgba(63,191,170,.6);}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px;flex-shrink:0;}
.sb-collapse-btn{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:rgba(255,255,255,.6);font-size:12.5px;width:100%;background:none;border:none;transition:background .15s var(--ease), color .15s var(--ease);
}
.sb-collapse-btn:hover{background:rgba(255,255,255,.07);color:#fff;}
.sb-collapse-btn svg{transition:transform .2s var(--ease);}
.sidebar.collapsed .sb-collapse-btn svg{transform:rotate(180deg);}

.main-col{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .2s var(--ease);display:flex;flex-direction:column;}
.main-col.collapsed{margin-left:var(--sidebar-w-collapsed);}

.topbar{
  height:var(--topbar-h);background:rgba(255,255,255,.86);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30;flex-shrink:0;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--text-2);padding:6px;border-radius:8px;transition:background .12s;}
.hamburger:hover{background:var(--surface-2);}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);}
.crumb b{color:var(--text);font-weight:600;font-size:16px;font-family:'Manrope';}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.profile-btn{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:30px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s var(--ease);}
.profile-btn:hover{background:var(--surface-2);border-color:var(--border-strong);box-shadow:var(--shadow-xs);}
.profile-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg, var(--primary-light), var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:700;font-size:12px;box-shadow:0 2px 5px rgba(11,93,82,.3);}
.profile-meta{text-align:left;line-height:1.25;}
.profile-meta b{display:block;font-size:12.5px;font-weight:600;}
.profile-meta span{font-size:10.5px;color:var(--text-3);}

.content{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;animation:fadeInUp .35s var(--ease) both;}
.page-head h1{font-size:22px;}
.page-head .sub{color:var(--text-2);font-size:13px;margin-top:4px;}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:all .14s var(--ease);white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--surface-2);border-color:#B8C0CC;transform:translateY(-1px);box-shadow:var(--shadow-xs);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(155deg, var(--primary-light), var(--primary));border-color:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(8,69,61,.15);}
.btn-primary:hover{background:linear-gradient(155deg, var(--primary), var(--primary-dark));border-color:var(--primary-dark);box-shadow:0 6px 16px rgba(11,93,82,.28);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{color:var(--pay);border-color:#F3D3CF;background:#fff;}
.btn-danger:hover{background:var(--pay-tint);border-color:var(--pay);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-icon{padding:7px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;box-shadow:none !important;}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);transition:box-shadow .2s var(--ease), border-color .2s var(--ease);}
.card-pad{padding:20px;}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-head h3{font-size:14.5px;display:flex;align-items:center;gap:7px;}
.card-head h3 svg{width:16px;height:16px;flex-shrink:0;color:var(--primary);}
.card-head .hint{font-size:11.5px;color:var(--text-3);}
.card-head .hint .range-highlight{color:var(--text);font-weight:700;}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
  position:relative;overflow:hidden;transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
  animation:fadeInUp .4s var(--ease) both;
}
.kpi-grid .kpi-card:nth-child(1){animation-delay:.02s}
.kpi-grid .kpi-card:nth-child(2){animation-delay:.06s}
.kpi-grid .kpi-card:nth-child(3){animation-delay:.10s}
.kpi-grid .kpi-card:nth-child(4){animation-delay:.14s}
.kpi-grid .kpi-card:nth-child(5){animation-delay:.18s}
.kpi-grid .kpi-card:nth-child(6){animation-delay:.22s}
.kpi-grid .kpi-card:nth-child(7){animation-delay:.26s}
.kpi-grid .kpi-card:nth-child(8){animation-delay:.30s}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg, var(--primary-light), var(--primary-tint-2));opacity:0;transition:opacity .18s var(--ease);}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.kpi-card:hover::before{opacity:1;}
.kpi-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.kpi-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--primary-tint),var(--primary-tint-2));color:var(--primary-dark);flex-shrink:0;}
.kpi-icon svg{width:17px;height:17px;}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500;margin-top:12px;}
.kpi-value{font-family:'JetBrains Mono';font-weight:600;font-size:20px;margin-top:4px;letter-spacing:-0.01em;}
.kpi-foot{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;color:var(--text-3);}
.kpi-foot.receive{color:var(--receive);}
.kpi-foot.pay{color:var(--pay);}

/* dashboard 5-card summary grid */
.dash-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;align-items:start;}
.dash-mini-card{cursor:pointer;transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);}
.dash-mini-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.dmc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.dmc-head h3{font-size:13.5px;font-weight:600;margin:0;}
.dmc-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border);color:var(--text-2);}
.dmc-row:last-of-type{border-bottom:none;}
.dmc-row b{font-family:'JetBrains Mono';color:var(--text);font-weight:600;font-size:13px;}
.dmc-row b.pay{color:var(--pay);}
.dmc-row b.rec{color:var(--receive);}
.dmc-total{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--text-3);}
.dmc-total b{font-family:'JetBrains Mono';color:var(--text);font-size:14px;}
.dash-chart-card{grid-column:span 4;cursor:default;}
.dash-chart-card:hover{transform:none;box-shadow:none;border-color:var(--border);}
@media (max-width:1100px){
  .dash-card-grid{grid-template-columns:repeat(2,1fr);}
  .dash-chart-card{grid-column:span 2;}
}
@media (max-width:640px){
  .dash-card-grid{grid-template-columns:1fr;}
  .dash-chart-card{grid-column:span 1;}
}

/* charts grid */
.chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
.chart-grid .card{animation:fadeInUp .4s var(--ease) both;}
.chart-grid .card:hover, .card-pad:hover{box-shadow:var(--shadow-sm);}
.chart-wrap{position:relative;padding:16px 20px 20px;}
.chart-canvas-box{position:relative;height:230px;}
.chart-canvas-box.tall{height:280px;}
.legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.empty-chart{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);gap:8px;}
.empty-chart svg{width:30px;height:30px;opacity:.5;}
.empty-chart span{font-size:12px;}

/* filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;}
.filter-bar.filter-bar-range{justify-content:space-between;}
.filter-bar.filter-bar-range .range-picker{margin-left:auto;}
@media (max-width:640px){
  .filter-bar.filter-bar-range{justify-content:flex-start;}
  .filter-bar.filter-bar-range .range-picker{margin-left:0;width:100%;}
}
.filter-bar .fb-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:600;margin-right:2px;}
.filter-bar select, .filter-bar input[type=date], .filter-bar input[type=text]{
  border:1px solid var(--border-strong);background:var(--surface-2);border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--text);
  font-family:inherit;transition:border-color .12s, box-shadow .12s;
}
.filter-bar select:focus, .filter-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);outline:none;}
.filter-bar .search-box{position:relative;flex:1;min-width:180px;}
.filter-bar .search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3);}
.filter-bar .search-box input{width:100%;padding-left:30px;}
.active-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--primary-tint);color:var(--primary-dark);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;animation:fadeIn .15s ease;}
.chip button{background:none;border:none;cursor:pointer;color:var(--primary-dark);display:flex;padding:0;}
.chip button svg{width:12px;height:12px;}
.clear-all{font-size:11.5px;color:var(--text-3);text-decoration:underline;cursor:pointer;background:none;border:none;padding:4px 0;}

/* table */
.table-scroll{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
table.data-table thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 14px;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2;
}
table.data-table thead th.sortable{cursor:pointer;user-select:none;transition:color .12s;}
table.data-table thead th.sortable:hover{color:var(--primary-dark);}
table.data-table thead th .sort-ind{display:inline-block;margin-left:3px;opacity:.55;}
table.data-table tbody td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
table.data-table tbody tr{transition:background .1s;}
table.data-table tbody tr:hover{background:var(--surface-2);}
table.data-table tbody tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right;}
.amt{font-family:'JetBrains Mono';font-weight:500;}
.desc-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.tbl-icon-btn{background:none;border:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--text-3);display:flex;transition:background .12s,color .12s;}
.tbl-icon-btn:hover{background:var(--surface-2);color:var(--text);}
.tbl-icon-btn.danger:hover{background:var(--pay-tint);color:var(--pay);}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--balanced-tint);color:var(--text-2);white-space:nowrap;}
.tag.unit-fibre{background:#E9F3FE;color:#175CD3;}
.tag.unit-chips{background:#FEF0E6;color:#B54708;}
.tag.unit-washing{background:#EAF7EF;color:#15803D;}

.table-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);flex-wrap:wrap;gap:10px;}
.pagination{display:flex;gap:4px;align-items:center;}
.page-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all .12s;}
.page-btn:hover{background:var(--surface-2);border-color:var(--border-strong);}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(11,93,82,.3);}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;text-align:center;color:var(--text-3);}
.empty-state .ic{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.empty-state .ic svg{width:24px;height:24px;color:var(--text-3);}
.empty-state h4{color:var(--text-2);font-size:14px;margin-bottom:4px;}
.empty-state p{font-size:12.5px;max-width:280px;}

/* skeleton */
.skel{background:linear-gradient(90deg,#EEF0F3 25%,#F6F7F9 37%,#EEF0F3 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:6px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-kpi{height:98px;border-radius:var(--radius);}
.skel-row{height:38px;border-radius:6px;margin-bottom:8px;}
.skel-chart{height:230px;border-radius:var(--radius);}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s, border-color .15s;}
.tab-btn:hover{color:var(--text-2);}
.tab-btn.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

.unit-switch{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:30px;padding:3px;overflow-x:auto;max-width:100%;}
.unit-switch.locked{background:none;border:none;padding:0;}
.unit-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:24px;border:none;background:none;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:all .15s var(--ease);flex-shrink:0;}
.unit-pill:hover{color:var(--text);}
.unit-pill.active{background:var(--surface);box-shadow:var(--shadow-xs);color:var(--text);}
.unit-pill svg{width:13px;height:13px;}
.unit-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0;}
.unit-pill .dot.unit-fibre{background:#175CD3;}
.unit-pill .dot.unit-chips{background:#B54708;}
.unit-pill .dot.unit-washing{background:#15803D;}
.unit-switch.multi .unit-pill .pill-check{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.unit-switch.multi .unit-pill .pill-check.checked{background:var(--primary);border-color:var(--primary);color:#fff;}
.unit-switch.multi .unit-pill .pill-check svg{width:9px;height:9px;}
.unit-switch.multi .unit-pill[data-unit-all]{border-right:1px solid var(--border);border-radius:0;padding-right:14px;margin-right:2px;}

/* ---------- Range picker (7D / 1M / YTD / Custom) ---------- */
.range-picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.range-pills{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:30px;padding:3px;flex-shrink:0;}
.range-pill{padding:6px 14px;border-radius:24px;border:none;background:none;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:all .15s var(--ease);}
.range-pill:hover{color:var(--text);}
.range-pill.active{background:var(--surface);box-shadow:var(--shadow-xs);color:var(--primary-dark);}
.range-custom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);animation:fadeIn .15s var(--ease) both;}
.range-custom input[type=date]{padding:6px 8px;border-radius:6px;border:1px solid var(--border-strong);font-size:12.5px;background:var(--surface);color:var(--text);}

/* ---------- Outstanding split (receivables / payables) ---------- */
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media (max-width:900px){.split-grid{grid-template-columns:1fr;}}
.split-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.split-head h3{font-size:14.5px;display:flex;align-items:center;gap:8px;}
.split-total{font-family:'JetBrains Mono';font-weight:600;font-size:15px;}
.unit-locked-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;margin-bottom:16px;}
.info-dot{cursor:pointer;}
.info-dot:active{transform:scale(.92);}
svg.ic-sm{width:13px;height:13px;}
table.data-table tbody tr.row-click{cursor:pointer;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px;font-weight:600;color:var(--text-2);}
.form-field .req{color:var(--pay);}
.form-field input, .form-field select, .form-field textarea{
  border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);
  transition:border-color .12s, box-shadow .12s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.form-field .amount-wrap{position:relative;}
.form-field .amount-wrap span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-family:'JetBrains Mono';font-size:13px;}
.form-field .amount-wrap input{padding-left:26px;font-family:'JetBrains Mono';}
.form-field .err{font-size:11.5px;color:var(--pay);display:none;}
.form-field.invalid input, .form-field.invalid select{border-color:var(--pay);}
.form-field.invalid .err{display:block;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,15,13,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadein .15s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalin .22s var(--ease-spring);}
.modal.wide{max-width:720px;}
@keyframes modalin{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-head h3{font-size:16px;}
.modal-head .close-x{background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px;border-radius:6px;transition:background .12s,color .12s;}
.modal-head .close-x:hover{background:var(--surface-2);color:var(--text);}
.modal-body{padding:22px;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0;}
.confirm-icon{width:44px;height:44px;border-radius:50%;background:var(--pay-tint);color:var(--pay);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.confirm-icon svg{width:22px;height:22px;}

/* import flow */
.dropzone{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:30px 20px;text-align:center;background:var(--surface-2);transition:border-color .15s, background .15s;}
.dropzone svg{width:30px;height:30px;color:var(--text-3);margin-bottom:8px;}
.dropzone p{font-size:12.5px;color:var(--text-2);margin:4px 0;}
.dropzone .fname{margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:8px;font-size:12.5px;}
.import-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.import-stat{border-radius:var(--radius);padding:14px;text-align:center;}
.import-stat.ok{background:var(--receive-tint);}
.import-stat.err{background:var(--pay-tint);}
.import-stat b{display:block;font-size:22px;font-family:'JetBrains Mono';}
.import-stat.ok b{color:var(--receive);}
.import-stat.err b{color:var(--pay);}
.import-stat span{font-size:11.5px;color:var(--text-2);}
.err-list{max-height:130px;overflow-y:auto;border:1px solid #F3D3CF;border-radius:8px;}
.err-row{display:flex;gap:8px;padding:8px 12px;font-size:12px;border-bottom:1px solid #F5DEDA;color:var(--text-2);}
.err-row:last-child{border-bottom:none;}
.err-row b{color:var(--pay);flex-shrink:0;}
.step-track{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
.step-dot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);font-weight:600;}
.step-dot .n{width:20px;height:20px;border-radius:50%;background:var(--balanced-tint);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:10.5px;transition:background .2s,color .2s;}
.step-dot.active .n{background:var(--primary);color:#fff;}
.step-dot.active{color:var(--text);}
.step-dot.done .n{background:var(--receive);color:#fff;}
.step-line{flex:1;height:1px;background:var(--border);}

/* toast */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{display:flex;align-items:center;gap:10px;background:var(--primary-darker);color:#fff;padding:11px 16px 11px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastin .22s var(--ease-spring);max-width:320px;border-left:3px solid #3FBFAA;}
.toast.err{background:#7A271A;border-left-color:#F04438;}
@keyframes toastin{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast svg{width:16px;height:16px;flex-shrink:0;}

/* settlement */
.explain-card{display:flex;gap:14px;background:linear-gradient(135deg, var(--primary-tint), #EEF7F4);border:1px solid var(--primary-tint-2);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:20px;}
.explain-card .ic{width:36px;height:36px;border-radius:9px;background:var(--surface);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-xs);}
.explain-card .ic svg{width:19px;height:19px;}
.explain-card h4{font-size:13.5px;color:var(--primary-darker);margin-bottom:3px;}
.explain-card p{font-size:12.5px;color:#0F4A41;line-height:1.6;}
.unit-section{margin-bottom:22px;}
.unit-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.unit-section-head h3{font-size:15px;display:flex;align-items:center;gap:8px;}
.partner-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.partner-card{border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;background:var(--surface);transition:box-shadow .18s var(--ease), transform .18s var(--ease);}
.partner-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.partner-card .pname{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.pc-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--text-2);}
.pc-row b{font-family:'JetBrains Mono';color:var(--text);font-weight:500;}
.bar-compare{position:relative;height:8px;background:var(--balanced-tint);border-radius:4px;margin:10px 0 6px;overflow:hidden;}
.bar-compare .fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width .5s var(--ease);}
.net-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:8px;}
.net-badge.receive{background:var(--receive-tint);color:var(--receive);}
.net-badge.pay{background:var(--pay-tint);color:var(--pay);}
.net-badge.balanced{background:var(--balanced-tint);color:var(--balanced);}
.net-badge svg{width:12px;height:12px;}
.info-dot{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--balanced-tint);color:var(--text-3);align-items:center;justify-content:center;font-size:9.5px;font-weight:700;cursor:pointer;position:relative;transition:background .12s,color .12s;}
.info-dot:hover{background:var(--primary-tint);color:var(--primary-dark);}
.overall-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;}
.strip-card{border-radius:var(--radius);padding:16px;text-align:center;transition:transform .18s var(--ease);}
.strip-card:hover{transform:translateY(-2px);}
.strip-card.receive{background:var(--receive-tint);}
.strip-card.pay{background:var(--pay-tint);}
.strip-card.net{background:var(--primary-tint);}
.strip-card b{display:block;font-family:'JetBrains Mono';font-size:20px;margin-top:4px;}
.strip-card.receive b{color:var(--receive);}
.strip-card.pay b{color:var(--pay);}
.strip-card.net b{color:var(--primary-dark);}
.strip-card span{font-size:11.5px;color:var(--text-2);font-weight:600;}
.settled-note{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--receive);margin-top:6px;line-height:1.4;}
.settled-note svg{width:11px;height:11px;flex-shrink:0;}

.transfer-card .card-head{border-bottom-color:rgba(255,255,255,.14);}

.transfer-card .hint{color:rgba(255,255,255,.6);}
.transfer-card.settled{background:var(--surface);color:var(--text);}

.transfer-card.settled .card-head h3 svg{color:var(--receive);}
.transfer-list{padding:6px 20px 18px;display:flex;flex-direction:column;gap:2px;}
.transfer-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.transfer-row:last-child{border-bottom:none;}
.t-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.t-names{flex:1;font-size:13px;color:rgba(255,255,255,.92);}
.t-names b{color:#fff;}
.t-amt{font-family:'JetBrains Mono';font-size:13.5px;font-weight:700;color:#fff;}
.btn-sm{font-size:11px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;cursor:pointer;transition:background .15s var(--ease);white-space:nowrap;}
.btn-sm:hover{background:rgba(255,255,255,.24);}
.ledger-card .card-head h3{display:flex;align-items:center;gap:7px;}
.ledger-card .card-head h3 svg{width:15px;height:15px;color:var(--primary);}

/* banking */
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.bank-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;transition:box-shadow .18s var(--ease);}
.bank-card:hover{box-shadow:var(--shadow-sm);}
.bank-card h4{font-size:12.5px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.bank-card h4 svg{width:16px;height:16px;color:var(--primary);}
.bank-line{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--border);}
.bank-line:last-of-type{border-bottom:none;}
.bank-line b{font-family:'JetBrains Mono';font-weight:600;}
.progress-bar{height:8px;background:var(--balanced-tint);border-radius:4px;overflow:hidden;margin:10px 0 4px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber-light),var(--amber));border-radius:4px;transition:width .5s var(--ease);}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);}

/* status badge */
.status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.status-badge.open{background:var(--pay-tint);color:var(--pay);}
.status-badge.pending{background:var(--amber-tint);color:var(--amber);}
.status-badge.tbd{background:var(--balanced-tint);color:var(--text-3);}

/* mobile drawer overlay */
.drawer-overlay{position:fixed;inset:0;background:rgba(6,15,13,.5);backdrop-filter:blur(2px);z-index:40;display:none;animation:fadeIn .15s ease;}
.drawer-overlay.show{display:block;}

@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .bank-grid{grid-template-columns:repeat(2,1fr);}
  .partner-cards{grid-template-columns:1fr 1fr;}
  .overall-strip{grid-template-columns:1fr 1fr;}
}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w);}
  .sidebar.mobile-open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  .main-col, .main-col.collapsed{margin-left:0;}
  .hamburger{display:flex;}
  .sb-collapse-btn{display:none;}
  .login-card{grid-template-columns:1fr;}
  .login-side{display:none;}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .partner-cards{grid-template-columns:1fr;}
  .overall-strip{grid-template-columns:1fr;}
  .bank-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .content{padding:16px;}
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;}
  .user-grid{grid-template-columns:1fr;}
  .profile-meta{display:none;}
  .profile-btn{padding:6px;}
  .unit-pill span:last-child{display:none;}
  .unit-pill.active span:last-child{display:inline;}
  .topbar-right{gap:8px;}
}
@media (max-width:520px){
  .topbar{padding:0 12px;}
  .crumb span{display:none;}
}

function visibleUnits(user){
  user = user || state.user;
  if(!user) return [];
  if(user.role==='Admin') return CC_LIST.slice();
  return CC_LIST.filter(cc => (UNIT_SHAREHOLDERS[cc]||[]).includes(user.id));
}
function defaultSelectedUnits(user){
  // Select every unit the user can see by default (mirrors the old "All Units" view).
  return visibleUnits(user);
}
/* Sanitized set of units currently in scope — always a non-empty subset of visibleUnits(). */
function unitsInScope(){
  const vis = visibleUnits();
  let sel = (state.selectedUnits||[]).filter(u=>vis.includes(u));
  if(sel.length===0) sel = vis.slice();
  return sel;
}
function isAllUnitsSelected(){
  const vis = visibleUnits();
  const sel = unitsInScope();
  return sel.length===vis.length;
}
/* Returns the single selected unit name if exactly one is in scope, otherwise null. */
function singleUnitScope(){
  const sel = unitsInScope();
  return sel.length===1 ? sel[0] : null;
}
function unitScopeLabel(){
  const sel = unitsInScope();
  const vis = visibleUnits();
  if(sel.length===vis.length) return vis.length>1 ? 'all units' : vis[0];
  return sel.join(', ');
}
function unitScopeNoteHtml(action){
  const sel = unitsInScope();
  const vis = visibleUnits();
  if(sel.length===vis.length) return '';
  return `<div class="unit-locked-note">${I('grid','ic-sm')} Showing <b style="color:var(--text);">${sel.join(', ')}</b> only — switch units from the top bar to ${action}.</div>`;
}
function syncUnitFilters(){
  const sel = unitsInScope();
  const single = sel.length===1 ? sel[0] : '';
  state.debit.cc = single; state.debit.page = 1;
  state.credit.cc = single; state.credit.page = 1;
  state.monthlySpend.cc = single;
  state.sales.cc = single;
  state.outstanding.cc = single;
  state.purchases.cc = single;
  state.transfers.cc = single;
  state.settlementUnit = single || sel[0] || 'Fibre Unit';
}
function toggleUnitSelection(unit){
  const vis = visibleUnits();
  if(!vis.includes(unit)) return;
  let sel = unitsInScope().slice();
  if(sel.includes(unit)){
    if(sel.length===1) return; // keep at least one unit selected
    sel = sel.filter(u=>u!==unit);
  } else {
    sel.push(unit);
  }
  state.selectedUnits = sel;
  syncUnitFilters();
  state.loading = true;
  render();
  setTimeout(()=>{ state.loading=false; render(); }, 320);
}
function selectAllUnits(){
  const vis = visibleUnits();
  if(vis.length<2) return;
  state.selectedUnits = vis.slice();
  syncUnitFilters();
  state.loading = true;
  render();
  setTimeout(()=>{ state.loading=false; render(); }, 320);
}

/* =========================================================================
   UTILS
   ========================================================================= */
function fmtINR(n, opts){
  opts = opts||{};
  if(n===null||n===undefined||isNaN(n)) return opts.dash!==false? '—':'';
  const neg = n<0; n = Math.abs(n);
  const dec = opts.decimals!==undefined?opts.decimals:0;
  let [intPart,decPart] = n.toFixed(dec).split('.');
  let last3 = intPart.slice(-3), rest = intPart.slice(0,-3);
  if(rest) last3 = ','+last3;
  let grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g,',') + last3;
  let out = '₹'+grouped+(decPart?('.'+decPart):'');
  if(neg) out = opts.paren ? '('+out+')' : '−'+out;
  return out;
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(dt.getDate()).padStart(2,'0')+' '+months[dt.getMonth()]+' '+dt.getFullYear();
}
function escapeHtml(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ccClass(cc){ return cc==='Fibre Unit'?'unit-fibre':cc==='Chips Unit'?'unit-chips':'unit-washing'; }
function ccHex(cc){ return cc==='Fibre Unit'?'#175CD3':cc==='Chips Unit'?'#B54708':'#15803D'; }
function sum(arr,f){ return arr.reduce((s,x)=>s+(f?f(x):x),0); }

/* =========================================================================
   DATE RANGE PICKER (7D / 1M / YTD / Custom) — shared by Dashboard, Debit, Credit
   ========================================================================= */
const LATEST_DATE = '2026-08-15'; // most recent logged transaction — treated as "today" for range math
const FY_START = '2026-04-01';
const RANGE_OPTIONS = [{k:'7d',l:'7D'},{k:'1m',l:'1M'},{k:'ytd',l:'YTD'},{k:'custom',l:'Custom'}];
/* Format a Date using its LOCAL calendar date (not toISOString, which converts to UTC first and
   silently shifts the date by a day for any timezone ahead of UTC, e.g. IST). */
function toLocalISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return toLocalISO(d); }
function addMonths(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return toLocalISO(d); }
function computeRange(rs){
  const key = (rs&&rs.range) || 'ytd';
  if(key==='custom') return {from:(rs&&rs.from)||'', to:(rs&&rs.to)||LATEST_DATE};
  if(key==='7d') return {from:addDays(LATEST_DATE,-6), to:LATEST_DATE};
  if(key==='1m') return {from:addDays(addMonths(LATEST_DATE,-1),1), to:LATEST_DATE};
  return {from:FY_START, to:LATEST_DATE}; // ytd = FY-to-date
}
function inDateRange(dateStr, range){ return (!range.from||dateStr>=range.from) && (!range.to||dateStr<=range.to); }
/* Monthly-bucketed data (e.g. DATA_MONTHLY_SPEND, DATA_SALES) only has a "Apr 2026" label, not a day.
   To let the range picker drive it too, treat each month as spanning its 1st–last day and test for overlap. */
function monthSpan(monthLabel){
  const d = new Date(monthLabel+' 01'); // 'Apr 2026 01' -> 1 Apr 2026
  const from = toLocalISO(d);
  const to = toLocalISO(new Date(d.getFullYear(), d.getMonth()+1, 0));
  return {from,to};
}
function monthInRange(monthLabel, range){
  const span = monthSpan(monthLabel);
  return (!range.to||span.from<=range.to) && (!range.from||span.to>=range.from);
}
function rangeLabel(rs){
  const key=(rs&&rs.range)||'ytd';
  const o = RANGE_OPTIONS.find(x=>x.k===key);
  if(key==='custom'){ const r=computeRange(rs); return r.from&&r.to? fmtDate(r.from)+' – '+fmtDate(r.to) : 'Pick a date range'; }
  return o?o.l:'YTD';
}
function renderRangePicker(scope, rs){
  const active = (rs&&rs.range)||'ytd';
  return `<div class="range-picker" data-range-scope="${scope}">
    <div class="range-pills">
      ${RANGE_OPTIONS.map(o=>`<button class="range-pill ${active===o.k?'active':''}" data-range="${scope}:${o.k}">${o.l}</button>`).join('')}
    </div>
    ${active==='custom'?`<span class="range-custom">
      <input type="date" data-range-from="${scope}" value="${(rs&&rs.from)||''}">
      <span>to</span>
      <input type="date" data-range-to="${scope}" value="${(rs&&rs.to)||LATEST_DATE}">
    </span>`:`<span class="range-custom">${rangeLabel(rs)}</span>`}
  </div>`;
}
function attachRangePicker(scope, rs){
  document.querySelectorAll(`[data-range^="${scope}:"]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      rs.range = btn.dataset.range.split(':')[1];
      renderPageBody();
    });
  });
  document.querySelector(`[data-range-from="${scope}"]`)?.addEventListener('change', e=>{ rs.from=e.target.value; renderPageBody(); });
  document.querySelector(`[data-range-to="${scope}"]`)?.addEventListener('change', e=>{ rs.to=e.target.value; renderPageBody(); });
}
function toast(msg,type){
  const box = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className='toast'+(type==='err'?' err':'');
  t.innerHTML = (type==='err'?I('alert'):I('check'))+'<span>'+escapeHtml(msg)+'</span>';
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(),250); }, 3200);
}

function unitTotals(units, range){

    if(range) rows = rows.filter(r=>monthInRange(r.month, range));

  });

}
function fundingTotals(units){
  // units: array of unit names in scope, or null/undefined for the full company ('Overall').
  const map = {'Shareholder - Jagadeesan':'Jagadeesan','Shareholder - Jagadeshwaran':'Jagadeshwaran','Shareholder - Vellingiri':'Vellingiri','Vikas':'Vikas','Payable to Alam':'Alam'};
  const out = {Jagadeesan:0,Jagadeshwaran:0,Vellingiri:0,Vikas:0,Alam:0,'Union Bank (UBI)':0};
  let rows;
  if(!units){
    rows = DATA_SUMMARY['Overall'];
  } else if(units.length===1){
    rows = DATA_SUMMARY[units[0]];
  } else {
    rows = units.flatMap(u=>DATA_SUMMARY[u]);
  }
  rows.forEach(r=>{
    const spend = r[1]+r[2]+r[3];
    if(map[r[0]]) out[map[r[0]]] += spend;
    else out['Union Bank (UBI)'] += spend;
  });
  return out;
}
/* Per-unit (or overall) financial snapshot for the Dashboard summary table.
   unit=null means "Total" across every unit currently in scope.
   Total Expense / Raw Materials use the full Monthly Spend totals (same source as the Monthly Spend
   and Summary & Settlement pages) filtered to the picked date range by month overlap — this keeps the
   Business Snapshot numbers consistent with the rest of the app instead of the smaller Debit sample feed. */
function dashboardMetrics(unit, range){
  const scopeUnits = unit ? [unit] : unitsInScope();
  const spendRows = DATA_MONTHLY_SPEND.filter(r=> scopeUnits.includes(r.cc) && monthInRange(r.month, range));
  const totalExpense = sum(spendRows, r=>r.expenses);
  const totalRaw = sum(spendRows, r=>r.rawMaterials);
  const sumSpend = totalExpense + totalRaw;

  const salesRows = DATA_SALES_LEDGER.filter(r=> scopeUnits.includes(r.cc));
  const salesInvoiced = sum(salesRows, r=>r.total);
  const salesPaid = sum(salesRows, r=>r.paid);
  const salesOutstanding = sum(salesRows, r=>r.balance);

  const purchaseRows = DATA_PURCHASES.filter(r=> scopeUnits.includes(r.cc) && r.total!==null);
  const purchaseOutstanding = sum(purchaseRows, r=>r.balance);
  const purchasePaid = sum(purchaseRows, r=>r.paid);
  const purchaseInvoiced = sum(purchaseRows, r=>r.total);

  let contribution = 0, fairShare = 0;
  scopeUnits.forEach(u=>{ contribution += DATA_SETTLEMENT[u].total[3]; fairShare += DATA_SETTLEMENT[u].total[4]; });

  return {totalExpense,totalRaw,sumSpend,salesInvoiced,salesPaid,salesOutstanding,purchaseInvoiced,purchasePaid,purchaseOutstanding,contribution,fairShare};
}

function renderDashboard(){
  const units = unitsInScope();
  const vis = visibleUnits();
  const allSelected = units.length===vis.length;
  const scope = units.length===1 ? units[0] : null; // single-unit scope, matches prior behavior
  const scopeLabel = unitScopeLabel();
  const range = computeRange(state.dashboard);
  const rLabel = rangeLabel(state.dashboard);
  const scopeUnits = allSelected ? vis : units;

  // Flow figures (spend, credits, sales) move with the date range picker — they're filtered to the selected window.
  const totalDebit = sum(DATA_MONTHLY_SPEND.filter(r=>scopeUnits.includes(r.cc) && monthInRange(r.month, range)), r=>r.total);
  const totalCredit = sum(DATA_CREDIT.filter(r=>scopeUnits.includes(r.cc) && inDateRange(r.date, range)), r=>r.amount);
  const salesRowsR = DATA_SALES.filter(r=>scopeUnits.includes(r.cc) && monthInRange(r.month, range));
  const totalInvoiced = sum(salesRowsR, r=>r.invoiced);
  const totalReceived = sum(salesRowsR, r=>r.received);

  // Balance / point-in-time figures (payables, receivables, banking, settlement) are current-position
  // snapshots, not a flow over time, so they intentionally stay the same regardless of the date range picker.
  const payableRowsD = DATA_PURCHASES.filter(r=>scopeUnits.includes(r.cc) && r.total!==null);
  const receivableRowsD = DATA_SALES_LEDGER.filter(r=>scopeUnits.includes(r.cc));

function drawChartsFor(page){
  if(typeof Chart === 'undefined'){
    // Charting library didn't load (e.g. offline first run) — show a friendly fallback instead of crashing the app.
    document.querySelectorAll('.chart-canvas-box').forEach(box=>{
      box.innerHTML = `<div class="empty-chart">${I('chart')}<span>Charts unavailable — reload the page</span></div>`;
    });

  }
  try{
  if(page==='dashboard'){
    const units = unitsInScope();
    const names = ['Jagadeesan','Jagadeshwaran','Vellingiri','Vikas'];
    const contribs = names.map(n=>{ let c=0; units.forEach(u=>{ const row=DATA_SETTLEMENT[u].rows.find(r=>r[0].replace('Shareholder - ','')===n); if(row) c+=row[5]; }); return c; });
    const fairs = names.map(n=>{ let f=0; units.forEach(u=>{ const row=DATA_SETTLEMENT[u].rows.find(r=>r[0].replace('Shareholder - ','')===n); if(row) f+=row[6]; }); return f; });
    const base = contribs.map((c,i)=>Math.min(c, fairs[i]));         // solid, filled portion
    const gap  = contribs.map((c,i)=>Math.max(fairs[i]-c, 0));        // hatched, still owed to reach fair share
    const over = contribs.map((c,i)=>Math.max(c-fairs[i], 0));        // solid, contributed beyond fair share
    state.charts.shareFair = new Chart(document.getElementById('chartShareFair'),{
      type:'bar',
      data:{
        labels:names,
        datasets:[
          {label:'Contribution', data:base, backgroundColor:'#0B5D52', borderRadius:{topLeft:0,topRight:0,bottomLeft:5,bottomRight:5}, maxBarThickness:56, stack:'s'},
          {label:'Over fair share', data:over, backgroundColor:'#0B5D52', borderRadius:{topLeft:5,topRight:5,bottomLeft:0,bottomRight:0}, maxBarThickness:56, stack:'s'},
          {label:'Still owed to reach fair share', data:gap, backgroundColor:hatchPattern('#96650F'), borderColor:'#96650F', borderWidth:1.5, borderRadius:{topLeft:5,topRight:5,bottomLeft:0,bottomRight:0}, maxBarThickness:56, stack:'s'},
        ]
      },
      options:{
        maintainAspectRatio:false, responsive:true,
        plugins:{
          legend:{display:true,position:'bottom',labels:{boxWidth:11,boxHeight:11,padding:14,font:{size:11}}},
          tooltip:{callbacks:{
            label:(ctx)=> ' '+ctx.dataset.label+': '+fmtINR(ctx.parsed.y),
            afterBody:(items)=>{ const i=items[0].dataIndex; return ['—','Fair share target: '+fmtINR(fairs[i])]; }
          }}
        },
        scales:{
          x:{stacked:true, grid:{display:false}, ticks:{font:{size:11}}},
          y:{stacked:true, grid:{color:'#EEF1F4'}, ticks:{font:{size:11}, callback:v=>fmtINR(v,{decimals:0}).replace('₹','₹ ')}},
        }
      }
    });
  }
  if(page==='monthlySpend') drawMonthlySpendChart();
  if(page==='settlement') drawSummaryChart(state.settlementUnit==='__overall'?'Overall':state.settlementUnit);
  if(page==='sales') drawSalesChart();
  }catch(err){
    console.error('Chart render failed:', err);
  }
}
function tooltipINR(){ return { callbacks:{ label:(ctx)=> ' '+ctx.label+': '+fmtINR(ctx.parsed) } }; }
/* Diagonal-stripe canvas pattern, used for the "still owed" segment of the shareholder chart
   (hatched instead of solid so it visually reads as a gap, not an actual paid-in amount). */
function hatchPattern(color){
  const c = document.createElement('canvas'); c.width = 8; c.height = 8;
  const ctx = c.getContext('2d');
  ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  [[-2,10,2,-2],[2,10,6,-2],[6,10,10,2]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  return ctx.createPattern(c, 'repeat');
}
function baseChartOpts(scaleOverrides, rotateX, horizNoRotate){
  return {
    maintainAspectRatio:false, responsive:true,
    plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> ' '+(ctx.dataset.label?ctx.dataset.label+': ':'')+fmtINR(ctx.parsed.y!==undefined?ctx.parsed.y:ctx.parsed)}} },
    scales:{
      x:{grid:{display:false}, ticks:{font:{size:11}, maxRotation: rotateX?38:0, minRotation: rotateX?38:0}},
      y:Object.assign({grid:{color:'#EEF1F4'}, ticks:{font:{size:11}}}, (scaleOverrides&&scaleOverrides.y)||{}),
    }
  };
}

/* =========================================================================
   GENERIC TABLE HELPERS
   ========================================================================= */
function sortRows(rows, key, dir){
  return [...rows].sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(typeof av==='string'){ av=av.toLowerCase(); bv=String(bv).toLowerCase(); }
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
}
function paginate(rows, page, size){
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/size));
  const p = Math.min(Math.max(1,page), pages);
  return {slice: rows.slice((p-1)*size, p*size), page:p, pages, total};
}
function paginationHtml(scope, page, pages, total, shown){
  let btns = '';
  for(let i=1;i<=pages;i++){
    if(pages>7 && i!==1 && i!==pages && Math.abs(i-page)>1){ if(i===2||i===pages-1) btns+=`<span style="padding:0 2px;color:var(--text-3);">…</span>`; continue; }
    btns += `<button class="page-btn ${i===page?'active':''}" data-page="${scope}:${i}">${i}</button>`;
  }
  return `<div class="table-foot">
    <span>Showing ${shown} of ${total}</span>
    <div class="pagination">
      <button class="page-btn" data-page="${scope}:${page-1}" ${page<=1?'disabled':''}>${I('chevLeft')}</button>
      ${btns}
      <button class="page-btn" data-page="${scope}:${page+1}" ${page>=pages?'disabled':''}>${I('chevRight')}</button>
    </div>
  </div>`;
}
function emptyStateHtml(title, sub, showClear, scope){
  return `<div class="empty-state">
    <div class="ic">${I('inbox')}</div>
    <h4>${title}</h4><p>${sub}</p>

function entityNetBalances(units){

function netBadge(net){
  if(Math.abs(net)<1) return `<span class="net-badge balanced">${I('check')} Balanced</span>`;
  if(net>0) return `<span class="net-badge receive">${I('up')} To Receive · ${fmtINR(net,{decimals:2})}</span>`;
  return `<span class="net-badge pay">${I('down')} To Pay · ${fmtINR(Math.abs(net),{decimals:2})}</span>`;
}
/* ---------- Settlement Ledger helpers ---------- */
function ledgerKey(scopeKey){ return scopeKey==='__overall' ? 'Overall' : scopeKey; }
function ledgerPartners(scopeKey){
  if(scopeKey==='__overall') return DATA_OVERALL_SETTLEMENT.map(r=>r[0].replace('Shareholder - ',''));
  return DATA_SETTLEMENT[scopeKey].rows.map(r=>r[0].replace('Shareholder - ',''));
}
function ledgerEntriesFor(scopeKey){
  if(scopeKey==='__overall'){
    // Overall rolls up every unit's logged payments plus any cross-unit ones, since Overall Net = sum of unit nets.
    return DATA_SETTLEMENT_LEDGER.filter(e=> e.unit==='Overall' || CC_LIST.includes(e.unit)).slice().sort((a,b)=> b.date.localeCompare(a.date));
  }
  const key = ledgerKey(scopeKey);
  return DATA_SETTLEMENT_LEDGER.filter(e=>e.unit===key).slice().sort((a,b)=> b.date.localeCompare(a.date));
}
function originalNet(scopeKey, partnerName){
  if(scopeKey==='__overall'){
    const row = DATA_OVERALL_SETTLEMENT.find(r=>r[0].replace('Shareholder - ','')===partnerName);
    return row ? row[6] : 0;
  }
  const row = DATA_SETTLEMENT[scopeKey].rows.find(r=>r[0].replace('Shareholder - ','')===partnerName);
  return row ? row[7] : 0;
}
/* Net amount this partner has already settled via logged payments (positive = reduces what they're owed or owe). */
function ledgerSettledAmount(scopeKey, partnerName){
  const entries = ledgerEntriesFor(scopeKey);
  let settled = 0;
  entries.forEach(e=>{
    if(e.from===partnerName) settled += e.amount; // they paid out -> settles what they owed
    if(e.to===partnerName) settled += e.amount;   // they received -> settles what was owed to them
  });
  return settled;
}
function outstandingNet(scopeKey, partnerName){
  const entries = ledgerEntriesFor(scopeKey);
  let net = originalNet(scopeKey, partnerName);
  entries.forEach(e=>{
    if(e.from===partnerName) net += e.amount; // paying down what they owe moves net toward / past 0
    if(e.to===partnerName) net -= e.amount;   // receiving reduces what's still owed to them
  });
  return net;
}
/* Ledger-aware net position per partner, aggregated across an arbitrary subset of units (used when
   the top unit switcher has more than one — but not all — units selected). */
function outstandingNetsForUnits(units){
  const map = {};
  units.forEach(u=>{
    DATA_SETTLEMENT[u].rows.forEach(r=>{
      const partnerName = r[0].replace('Shareholder - ','');
      map[partnerName] = (map[partnerName]||0) + outstandingNet(u, partnerName);
    });
  });
  return Object.entries(map).map(([name,net])=>({name,net}));
}
/* Greedy minimum-transfer settlement suggestion from a set of {name, net} outstanding positions. */
function computeTransfers(nets){
  const receivers = nets.filter(n=>n.net>0.5).map(n=>({name:n.name, amt:n.net})).sort((a,b)=>b.amt-a.amt);
  const payers = nets.filter(n=>n.net<-0.5).map(n=>({name:n.name, amt:-n.net})).sort((a,b)=>b.amt-a.amt);
  const transfers = [];
  let i=0, j=0;
  while(i<payers.length && j<receivers.length){
    const amt = Math.min(payers[i].amt, receivers[j].amt);
    if(amt>0.5) transfers.push({from:payers[i].name, to:receivers[j].name, amount:amt});
    payers[i].amt -= amt; receivers[j].amt -= amt;
    if(payers[i].amt<=0.5) i++;
    if(receivers[j].amt<=0.5) j++;
  }
  return transfers;
}
function renderTransfersCard(scopeKey){
  const partners = ledgerPartners(scopeKey);
  const nets = partners.map(name=>({name, net: outstandingNet(scopeKey, name)}));
  const transfers = computeTransfers(nets);
  if(transfers.length===0){

  return `<div class="card transfer-card" style="margin-bottom:16px;">

/* =========================================================================
   LEDGER BOOK — one running Dr/Cr ledger per entity (4 shareholders,
   Alam, 3 bank accounts). Same sign convention already used for
   DATA_SUMMARY / entityNetBalances: money paid THROUGH an entity for the
   business is a Credit to that entity's ledger (business now owes them
   more); money received TO an entity, or sent out of it via a transfer,
   is a Debit (reduces what's owed to them). Running balance = net position.
   ========================================================================= */
function entityLedgerRows(entity, units){
  const rows = [];
  DATA_DEBIT.filter(r=>units.includes(r.cc) && r.paidThrough===entity).forEach(r=>{
    rows.push({date:r.date, cc:r.cc, particulars:`Paid for ${r.account} — ${r.description}`, amount:r.amount});
  });
  DATA_CREDIT.filter(r=>units.includes(r.cc) && r.receivedTo===entity).forEach(r=>{
    rows.push({date:r.date, cc:r.cc, particulars:`Received — ${r.description}`, amount:-r.amount});
  });
  DATA_TRANSFERS.filter(r=>units.includes(r.cc) && (r.from===entity||r.to===entity)).forEach(r=>{
    if(r.from===entity) rows.push({date:r.date, cc:r.cc, particulars:`Transfer to ${ENTITY_SHORT[r.to]}${r.note?' — '+r.note:''}`, amount:-r.amount});
    if(r.to===entity) rows.push({date:r.date, cc:r.cc, particulars:`Transfer from ${ENTITY_SHORT[r.from]}${r.note?' — '+r.note:''}`, amount:r.amount});
  });
  rows.sort((a,b)=> a.date===b.date ? 0 : a.date.localeCompare(b.date));
  let bal = 0;
  return rows.map(r=>{
    bal += r.amount;
    return {date:r.date, cc:r.cc, particulars:r.particulars, debit: r.amount<0?-r.amount:0, credit: r.amount>0?r.amount:0, balance:bal};
  });
}

function openModal(html){ document.getElementById('modalRoot').innerHTML = html; attachModalHandlers(); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('modalRoot')?.firstElementChild) closeModal();
});
document.addEventListener('click', e=>{
  const infoEl = e.target.closest('[data-info]');
  if(infoEl){ openInfoModal(infoEl.dataset.info); }
});
function attachModalHandlers(){
  document.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', closeModal));
  document.querySelector('.modal-overlay')?.addEventListener('click',(e)=>{ if(e.target.classList.contains('modal-overlay')) closeModal(); });
}

function fieldOptions(list, sel){ return list.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join(''); }

function openDeleteConfirm(kind, id){
  openModal(`
    <div class="modal-overlay">
      <div class="modal" style="max-width:420px;">
        <div class="modal-body" style="padding-top:26px;">
          <div class="confirm-icon">${I('trash')}</div>
          <h3 style="font-size:16px;margin-bottom:6px;">Delete this transaction?</h3>
          <p style="font-size:13px;color:var(--text-2);">This will permanently remove the entry from ${({debit:'Debit',credit:'Credit',purchase:'Purchases',sale:'Sales'})[kind]||kind}. This can't be undone.</p>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close-modal>Cancel</button>
          <button class="btn btn-danger" id="confirmDelBtn" style="background:var(--pay);color:#fff;border-color:var(--pay);">${I('trash')} Delete</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('confirmDelBtn').addEventListener('click', ()=>{
    const navTarget = {debit:'debit', credit:'credit', purchase:'purchases', sale:'sales'}[kind] || kind;
    if(kind==='debit'){ const i=DATA_DEBIT.findIndex(r=>r.id===id); if(i>-1) DATA_DEBIT.splice(i,1); }
    else if(kind==='credit'){ const i=DATA_CREDIT.findIndex(r=>r.id===id); if(i>-1) DATA_CREDIT.splice(i,1); }
    else if(kind==='purchase'){ const i=DATA_PURCHASES.findIndex(r=>r.id===id); if(i>-1) DATA_PURCHASES.splice(i,1); }
    else if(kind==='sale'){ const i=DATA_SALES_LEDGER.findIndex(r=>r.id===id); if(i>-1) DATA_SALES_LEDGER.splice(i,1); }
    closeModal(); toast('Transaction deleted'); navigate(navTarget);
  });
}

      document.getElementById('importFoot').innerHTML = `
        <button class="btn" data-close-modal>Cancel</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-right:auto;">
          <input type="checkbox" id="skipErrChk" checked> Skip ${errRows.length} error row${errRows.length===1?'':'s'} and import the rest
        </label>
        <button class="btn btn-primary" id="confirmImportBtn">${I('check')} Confirm Import (${okRows.length} rows)</button>
      `;
      attachModalHandlers();
      document.getElementById('confirmImportBtn').addEventListener('click', ()=>{
        okRows.forEach(r=>{
          if(kind==='debit') DATA_DEBIT.unshift({id:nid('d'), date:r.date, cc:r.cc, type:'Expense', account:r.account, paidThrough:r.paidThrough, description:'Imported row', amount:r.amount});
          else DATA_CREDIT.unshift({id:nid('c'), date:r.date, cc:r.cc, type:CREDIT_TYPE_LIST[0], receivedTo:r.receivedTo, description:'Imported row', amount:r.amount});
        });
        closeModal();
        toast(okRows.length+' '+label.toLowerCase()+' rows imported successfully');
        navigate(kind);
      });
    }
  });
}

/* =========================================================================
   PAGE-LEVEL EVENT HANDLERS
   ========================================================================= */
function attachPageHandlers(page){
  document.querySelectorAll('[data-nav-to]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.navTo)));

  // sorting / pagination / clear / unchip (generic)
  document.querySelectorAll('[data-sort]').forEach(el=>el.addEventListener('click',()=>{
    const [scope,key] = el.dataset.sort.split(':');
    const st = state[scope];
    if(st.sort===key) st.dir = st.dir==='asc'?'desc':'asc'; else { st.sort=key; st.dir='asc'; }
    renderPageBody();
  }));
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{
    if(el.disabled) return;
    const [scope,p] = el.dataset.page.split(':');
    state[scope].page = parseInt(p);
    renderPageBody();
  }));
  document.querySelectorAll('[data-clear]').forEach(el=>el.addEventListener('click',()=>{
    const scope = el.dataset.clear;
    if(scope==='debit') Object.assign(state.debit,{q:'',cc:'',pt:'',ty:'both',range:'ytd',from:'',to:'',page:1});
    if(scope==='credit') Object.assign(state.credit,{q:'',cc:'',rt:'',ty:'',range:'ytd',from:'',to:'',page:1});
    if(scope==='outstanding') Object.assign(state.outstanding,{q:'',cc:''});
    if(scope==='purchases') Object.assign(state.purchases,{q:'',cc:''});
    if(scope==='transfers') Object.assign(state.transfers,{cc:'',from:'',to:''});
    if(scope==='sales') Object.assign(state.sales,{cc:'',q:''});
    if(scope==='monthlySpend') Object.assign(state.monthlySpend,{cc:'',month:''});
    if(scope==='histAlam') Object.assign(state.histAlam,{q:'',page:1});
    renderPageBody();
  }));
  document.querySelectorAll('[data-unchip]').forEach(el=>el.addEventListener('click',()=>{
    const [scope,key] = el.dataset.unchip.split(':');
    state[scope][key] = '';
    renderPageBody();
  }));

  if(page==='dashboard'){
    attachRangePicker('dashboard', state.dashboard);
  }
  if(page==='debit'){
    const f = state.debit;
    attachRangePicker('debit', f);
    document.getElementById('debitSearch').addEventListener('input', e=>{ f.q=e.target.value; f.page=1; renderPageBody(); });
    document.querySelectorAll('[data-unit-tab^="debit:"]').forEach(el=>el.addEventListener('click',()=>{
      const val = el.dataset.unitTab.split(':')[1]; f.cc = val==='__all'?'':val; f.page=1; renderPageBody();
    }));
    document.getElementById('debitTY').addEventListener('change', e=>{ f.ty=e.target.value; f.page=1; renderPageBody(); });
    document.getElementById('debitPT').addEventListener('change', e=>{ f.pt=e.target.value; f.page=1; renderPageBody(); });
    document.getElementById('btnAddDebit')?.addEventListener('click', ()=>openDebitForm(null));
    document.getElementById('btnImportDebit')?.addEventListener('click', ()=>openImportModal('debit'));
    document.querySelectorAll('[data-edit-debit]').forEach(el=>el.addEventListener('click',()=>{
      const r = DATA_DEBIT.find(x=>x.id===el.dataset.editDebit); openDebitForm(r);
    }));
    document.querySelectorAll('[data-del-debit]').forEach(el=>el.addEventListener('click',()=> openDeleteConfirm('debit', el.dataset.delDebit)));
    document.querySelectorAll('[data-view-debit]').forEach(el=>el.addEventListener('click', e=>{
      if(e.target.closest('[data-edit-debit],[data-del-debit]')) return;
      const r = DATA_DEBIT.find(x=>x.id===el.dataset.viewDebit); if(r) openDebitDetail(r);
    }));
  }
  if(page==='credit'){
    const f = state.credit;
    attachRangePicker('credit', f);
    document.getElementById('creditSearch').addEventListener('input', e=>{ f.q=e.target.value; f.page=1; renderPageBody(); });
    document.querySelectorAll('[data-unit-tab^="credit:"]').forEach(el=>el.addEventListener('click',()=>{
      const val = el.dataset.unitTab.split(':')[1]; f.cc = val==='__all'?'':val; f.page=1; renderPageBody();
    }));
    document.getElementById('creditTY').addEventListener('change', e=>{ f.ty=e.target.value; f.page=1; renderPageBody(); });
    document.getElementById('creditRT').addEventListener('change', e=>{ f.rt=e.target.value; f.page=1; renderPageBody(); });
    document.getElementById('btnAddCredit')?.addEventListener('click', ()=>openCreditForm(null));
    document.getElementById('btnImportCredit')?.addEventListener('click', ()=>openImportModal('credit'));
    document.querySelectorAll('[data-edit-credit]').forEach(el=>el.addEventListener('click',()=>{
      const r = DATA_CREDIT.find(x=>x.id===el.dataset.editCredit); openCreditForm(r);
    }));
    document.querySelectorAll('[data-del-credit]').forEach(el=>el.addEventListener('click',()=> openDeleteConfirm('credit', el.dataset.delCredit)));
    document.querySelectorAll('[data-view-credit]').forEach(el=>el.addEventListener('click', e=>{
      if(e.target.closest('[data-edit-credit],[data-del-credit]')) return;
      const r = DATA_CREDIT.find(x=>x.id===el.dataset.viewCredit); if(r) openCreditDetail(r);
    }));
  }
  if(page==='monthlySpend'){
    document.getElementById('msCC')?.addEventListener('change', e=>{ state.monthlySpend.cc=e.target.value; renderPageBody(); });
    document.getElementById('msMonth').addEventListener('change', e=>{ state.monthlySpend.month=e.target.value; renderPageBody(); });
  }
  if(page==='settlement'){
    document.querySelectorAll('[data-settle-tab]').forEach(el=>el.addEventListener('click',()=>{ state.settlementUnit=el.dataset.settleTab; renderPageBody(); }));
    document.querySelectorAll('[data-log-payment]').forEach(el=>el.addEventListener('click',()=> openLedgerForm(el.dataset.scope, null)));
    document.querySelectorAll('[data-log-transfer]').forEach(el=>el.addEventListener('click',()=>{
      openLedgerForm(el.dataset.scope, {from:el.dataset.from, to:el.dataset.to, amount:parseFloat(el.dataset.amt).toFixed(2)});
    }));
    document.querySelectorAll('[data-del-ledger]').forEach(el=>el.addEventListener('click',()=>{
      const id = el.dataset.delLedger;
      DATA_SETTLEMENT_LEDGER = DATA_SETTLEMENT_LEDGER.filter(e=>e.id!==id);
      toast('Ledger entry removed');
      renderPageBody();
    }));
  }
  if(page==='sales'){
    document.getElementById('salesCC')?.addEventListener('change', e=>{ state.sales.cc=e.target.value; renderPageBody(); });
    document.getElementById('salesQ')?.addEventListener('input', e=>{ state.sales.q=e.target.value; renderPageBody(); });
    document.getElementById('btnAddSale')?.addEventListener('click', ()=>openSaleForm());
    document.querySelectorAll('[data-edit-sale]').forEach(el=>el.addEventListener('click',()=>{
      const r = DATA_SALES_LEDGER.find(x=>x.id===el.dataset.editSale); if(r) openSaleForm(r);
    }));
    document.querySelectorAll('[data-del-sale]').forEach(el=>el.addEventListener('click',()=> openDeleteConfirm('sale', el.dataset.delSale)));
  }
  if(page==='outstanding'){
    document.getElementById('outSearch').addEventListener('input', e=>{ state.outstanding.q=e.target.value; renderPageBody(); });
    document.getElementById('outCC')?.addEventListener('change', e=>{ state.outstanding.cc=e.target.value; renderPageBody(); });
  }
  if(page==='purchases'){
    document.getElementById('purchSearch').addEventListener('input', e=>{ state.purchases.q=e.target.value; renderPageBody(); });
    document.getElementById('purchCC')?.addEventListener('change', e=>{ state.purchases.cc=e.target.value; renderPageBody(); });
    document.getElementById('btnAddPurchase')?.addEventListener('click', ()=>openPurchaseForm());
    document.querySelectorAll('[data-edit-purchase]').forEach(el=>el.addEventListener('click',()=>{
      const r = DATA_PURCHASES.find(x=>x.id===el.dataset.editPurchase); if(r) openPurchaseForm(r);
    }));
    document.querySelectorAll('[data-del-purchase]').forEach(el=>el.addEventListener('click',()=> openDeleteConfirm('purchase', el.dataset.delPurchase)));
  }
  if(page==='transfers'){
    document.querySelectorAll('[data-unit-tab^="transfers:"]').forEach(el=>el.addEventListener('click',()=>{
      const val = el.dataset.unitTab.split(':')[1]; state.transfers.cc = val==='__all'?'':val; state.transfers.page=1; renderPageBody();
    }));
    document.getElementById('trFrom')?.addEventListener('change', e=>{ state.transfers.from=e.target.value; state.transfers.page=1; renderPageBody(); });
    document.getElementById('trTo')?.addEventListener('change', e=>{ state.transfers.to=e.target.value; state.transfers.page=1; renderPageBody(); });
    document.getElementById('btnAddTransfer')?.addEventListener('click', ()=>openTransferForm());
    document.querySelectorAll('[data-edit-transfer]').forEach(el=>el.addEventListener('click',()=>{
      const row = DATA_TRANSFERS.find(x=>x.id===el.dataset.editTransfer);
      if(row) openTransferForm(row);
    }));
  }
  if(page==='banking'){
    document.getElementById('btnEditBanking')?.addEventListener('click', ()=>toast('Banking snapshot edit form — prototype only'));
  }
  if(page==='entityLedgers'){
    document.querySelectorAll('[data-entity-tab]').forEach(el=>el.addEventListener('click',()=>{
      state.entityLedger = el.dataset.entityTab; renderPageBody();
    }));
  }
  if(page==='historicalAlam'){
    document.getElementById('histSearch').addEventListener('input', e=>{ state.histAlam.q=e.target.value; state.histAlam.page=1; renderPageBody(); });
    document.getElementById('btnAddHist')?.addEventListener('click', ()=>toast('Add historical entry form — prototype only'));
  }
}

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
</body>
</html>
