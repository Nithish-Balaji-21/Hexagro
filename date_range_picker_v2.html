<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Date Range Picker — Redesign v2</title>
<style>
  :root{
    --ink:#1C2321;
    --ink-soft:#5C6862;
    --line:#DDE3DF;
    --line-soft:#EEF1EF;
    --paper:#FFFFFF;
    --stage:#F6F8F6;
    --accent:#16613F;
    --accent-soft:#E4EFE8;
    --accent-hover:#134F33;
    --radius:12px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--stage);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:80px 24px;
    color:var(--ink);
  }
  .stage-label{
    position:fixed;
    top:28px; left:32px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .stage-label b{ color:var(--ink); font-weight:600; }

  .bar{
    display:inline-flex;
    align-items:center;
    gap:10px;
    position:relative;
  }

  /* ---- Left: date display pill ---- */
  .date-pill{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 14px;
    box-shadow: 0 1px 2px rgba(28,35,33,.04);
  }
  .date-pill svg{
    width:16px; height:16px;
    color:var(--accent);
    flex-shrink:0;
  }
  .date-pill .txt{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .date-pill .txt .dash{
    color:var(--ink-soft);
    font-weight:400;
    margin:0 5px;
  }

  /* ---- Right: segmented control ---- */
  .picker{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:11px;
    padding:4px;
    box-shadow: 0 1px 2px rgba(28,35,33,.04);
    position:relative;
  }
  .picker button{
    all:unset;
    cursor:pointer;
    position:relative;
    z-index:2;
    padding:8px 16px;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    border-radius:8px;
    transition: color .18s ease;
    white-space:nowrap;
  }
  .picker button:hover{ color:var(--ink); }
  .picker button.active{ color:#fff; }

  .indicator{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width:0;
    background: var(--accent);
    border-radius:8px;
    transition: transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }

  /* ---- Calendar panel ---- */
  .panel{
    position:absolute;
    top: calc(100% + 10px);
    right:0;
    width:600px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow: 0 16px 40px rgba(20,30,25,.14), 0 2px 8px rgba(20,30,25,.06);
    opacity:0;
    transform: translateY(-6px) scale(.98);
    pointer-events:none;
    transition: opacity .17s ease, transform .17s ease;
    z-index:50;
    overflow:hidden;
  }
  .panel.open{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
  }

  .panel-head{
    padding:14px 20px;
    border-bottom:1px solid var(--line-soft);
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .presets-row{
    display:flex;
    gap:6px;
    padding:12px 20px;
    border-bottom:1px solid var(--line-soft);
    flex-wrap:wrap;
  }
  .presets-row button{
    all:unset;
    cursor:pointer;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:6px 11px;
    border-radius:7px;
    border:1px solid var(--line);
    transition: all .15s ease;
  }
  .presets-row button:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }

  .months{
    display:flex;
    padding:16px 20px 8px;
    gap:24px;
  }
  .month{ flex:1; }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .month-nav .mname{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .month-nav .navbtn{
    all:unset;
    cursor:pointer;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    color:var(--ink-soft);
  }
  .month-nav .navbtn:hover{ background:var(--line-soft); color:var(--ink); }
  .month-nav .navbtn.hidden{ visibility:hidden; }

  table{ width:100%; border-collapse:collapse; }
  th{
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
    padding-bottom:6px;
  }
  td{
    text-align:center;
    padding:1px;
  }
  .day{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px; height:32px;
    margin:0 auto;
    font-size:12.5px;
    color:var(--ink);
    border-radius:8px;
    position:relative;
    transition: background .12s ease, color .12s ease;
  }
  .day.muted{ color:#C7CFC9; cursor:default; }
  .day.today{ font-weight:700; color:var(--accent); }
  .day:not(.muted):hover{ background:var(--line-soft); }

  .day.in-range{ background: var(--accent-soft); border-radius:0; }
  .day.range-start{ background:var(--accent); color:#fff; border-radius:8px 0 0 8px; }
  .day.range-end{ background:var(--accent); color:#fff; border-radius:0 8px 8px 0; }
  .day.range-single{ background:var(--accent); color:#fff; border-radius:8px; }

  .panel-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-top:1px solid var(--line-soft);
    background:var(--stage);
  }
  .panel-foot .hint{
    font-size:12px;
    color:var(--ink-soft);
  }
  .foot-actions{ display:flex; gap:8px; }
  .foot-actions button{
    all:unset;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    padding:8px 16px;
    border-radius:8px;
  }
  .btn-cancel{ color:var(--ink-soft); }
  .btn-cancel:hover{ color:var(--ink); background:var(--line-soft); }
  .btn-apply{ background:var(--accent); color:#fff; }
  .btn-apply:hover{ background:var(--accent-hover); }
</style>
</head>
<body>

<div class="stage-label">Component preview — date pill separated from <b>tab control</b></div>

<div class="bar">
  <div class="date-pill" id="datePill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
    <span class="txt" id="pillText">Aug 30, 2026</span>
  </div>

  <div class="picker" id="picker">
    <div class="indicator" id="indicator"></div>
    <button data-range="7d">7D</button>
    <button data-range="1m">1M</button>
    <button data-range="ytd" class="active">YTD</button>
    <button data-range="custom" id="customBtn">Custom</button>
  </div>

  <div class="panel" id="panel">
    <div class="panel-head" id="panelHead">Pick a start date</div>

    <div class="presets-row">
      <button data-preset="today">Today</button>
      <button data-preset="yesterday">Yesterday</button>
      <button data-preset="thisweek">This week</button>
      <button data-preset="lastweek">Last week</button>
      <button data-preset="thismonth">This month</button>
      <button data-preset="lastmonth">Last month</button>
      <button data-preset="thisyear">This year</button>
    </div>

    <div class="months" id="monthsRow"></div>

    <div class="panel-foot">
      <div class="hint" id="hintText">Pick a start and end date</div>
      <div class="foot-actions">
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn-apply" id="applyBtn">Apply</button>
      </div>
    </div>
  </div>
</div>

<script>
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let today = new Date(2026, 7, 31); // Aug 31 2026
let leftView = { y: 2026, m: 7 };
let rightView = { y: 2026, m: 8 };

let rangeStart = new Date(2026, 7, 30);
let rangeEnd = new Date(2026, 7, 30);
let picking = 'start';
let hoverDate = null;
let confirmedStart = new Date(2026,7,30), confirmedEnd = new Date(2026,7,30);

const picker = document.getElementById('picker');
const indicator = document.getElementById('indicator');
const panel = document.getElementById('panel');
const monthsRow = document.getElementById('monthsRow');
const panelHead = document.getElementById('panelHead');
const applyBtn = document.getElementById('applyBtn');
const hintText = document.getElementById('hintText');
const pillText = document.getElementById('pillText');

function fmt(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtFull(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dayCount(a,b){ return Math.round((b-a)/(1000*60*60*24)) + 1; }

function moveIndicator(btn){
  const pr = picker.getBoundingClientRect();
  const br = btn.getBoundingClientRect();
  indicator.style.width = br.width + 'px';
  indicator.style.transform = `translateX(${br.left - pr.left - 4}px)`;
}
function setActiveTab(btn){
  picker.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  moveIndicator(btn);
}

function updatePill(){
  if(sameDay(confirmedStart, confirmedEnd)){
    pillText.textContent = fmtFull(confirmedStart);
  } else {
    pillText.innerHTML = `${fmtFull(confirmedStart)}<span class="dash">–</span>${fmtFull(confirmedEnd)}`;
  }
}

// preset -> concrete date range, also updates the pill immediately (non-custom tabs)
function applyQuickRange(key){
  const d = new Date(today);
  let s,e;
  if(key==='7d'){ e=new Date(d); s=new Date(d); s.setDate(s.getDate()-6); }
  if(key==='1m'){ e=new Date(d); s=new Date(d); s.setMonth(s.getMonth()-1); s.setDate(s.getDate()+1); }
  if(key==='ytd'){ e=new Date(d); s=new Date(d.getFullYear(),0,1); }
  confirmedStart = s; confirmedEnd = e;
  rangeStart = s; rangeEnd = e;
  updatePill();
}

picker.querySelectorAll('button[data-range]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    setActiveTab(btn);
    if(btn.dataset.range === 'custom'){
      openPanel();
    } else {
      closePanel();
      applyQuickRange(btn.dataset.range);
    }
  });
});

function openPanel(){ panel.classList.add('open'); render(); }
function closePanel(){ panel.classList.remove('open'); }

document.addEventListener('click', (e)=>{
  if(!panel.contains(e.target) && !picker.contains(e.target)){
    closePanel();
  }
});

document.getElementById('cancelBtn').addEventListener('click', ()=>{
  rangeStart = confirmedStart; rangeEnd = confirmedEnd;
  picking = 'start';
  closePanel();
});

applyBtn.addEventListener('click', ()=>{
  confirmedStart = rangeStart; rangeEnd = rangeEnd;
  confirmedStart = rangeStart < rangeEnd ? rangeStart : rangeEnd;
  confirmedEnd = rangeStart < rangeEnd ? rangeEnd : rangeStart;
  updatePill();
  closePanel();
});

document.querySelectorAll('.presets-row button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const p = b.dataset.preset;
    let s,e;
    const d = new Date(today);
    if(p==='today'){ s=new Date(d); e=new Date(d); }
    if(p==='yesterday'){ s=new Date(d); s.setDate(s.getDate()-1); e=new Date(s); }
    if(p==='thisweek'){ s=new Date(d); s.setDate(d.getDate()-d.getDay()); e=new Date(d); }
    if(p==='lastweek'){ e=new Date(d); e.setDate(d.getDate()-d.getDay()-1); s=new Date(e); s.setDate(e.getDate()-6); }
    if(p==='thismonth'){ s=new Date(d.getFullYear(), d.getMonth(), 1); e=new Date(d); }
    if(p==='lastmonth'){ e=new Date(d.getFullYear(), d.getMonth(), 0); s=new Date(e.getFullYear(), e.getMonth(), 1); }
    if(p==='thisyear'){ s=new Date(d.getFullYear(),0,1); e=new Date(d); }
    rangeStart = s; rangeEnd = e; picking='start';
    leftView = { y: s.getFullYear(), m: s.getMonth() };
    rightView = { y: e.getFullYear(), m: e.getMonth() };
    if(leftView.y===rightView.y && leftView.m===rightView.m){
      rightView.m += 1;
      if(rightView.m>11){ rightView.m=0; rightView.y+=1; }
    }
    render();
  });
});

function buildMonth(view, side){
  const {y,m} = view;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  let cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i, muted:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, muted:false, date:new Date(y,m,d)});
  while(cells.length % 7 !== 0) cells.push({day: cells.length - startDow - daysInMonth + 1, muted:true});

  let rows = '';
  for(let r=0; r<cells.length/7; r++){
    rows += '<tr>';
    for(let c=0;c<7;c++){
      const cell = cells[r*7+c];
      if(cell.muted){ rows += `<td><span class="day muted">${cell.day}</span></td>`; continue; }
      const dt = cell.date;
      const cls = ['day'];
      if(sameDay(dt, today)) cls.push('today');

      const lo = rangeStart < rangeEnd ? rangeStart : rangeEnd;
      const hi = rangeStart < rangeEnd ? rangeEnd : rangeStart;
      const previewHi = picking==='end' && hoverDate && hoverDate > rangeStart ? hoverDate : hi;
      const previewLo = picking==='end' && hoverDate && hoverDate < rangeStart ? hoverDate : lo;

      if(sameDay(dt, rangeStart) && sameDay(rangeStart, rangeEnd) && picking!=='end'){
        cls.push('range-single');
      } else if(sameDay(dt, previewLo)) {
        cls.push(sameDay(previewLo, previewHi) ? 'range-single' : 'range-start');
      } else if(sameDay(dt, previewHi)) {
        cls.push('range-end');
      } else if(dt > previewLo && dt < previewHi) {
        cls.push('in-range');
      }

      rows += `<td><button class="${cls.join(' ')}" data-side="${side}" data-y="${y}" data-m="${m}" data-d="${cell.day}">${cell.day}</button></td>`;
    }
    rows += '</tr>';
  }

  return `
    <div class="month">
      <div class="month-nav">
        <button class="navbtn ${side==='right'?'hidden':''}" data-nav="prev" data-side="${side}">‹</button>
        <span class="mname">${MONTH_NAMES[m]} ${y}</span>
        <button class="navbtn ${side==='left'?'hidden':''}" data-nav="next" data-side="${side}">›</button>
      </div>
      <table>
        <thead><tr>${DOW.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function render(){
  monthsRow.innerHTML = buildMonth(leftView,'left') + buildMonth(rightView,'right');

  if(sameDay(rangeStart, rangeEnd) && picking!=='end'){
    panelHead.textContent = `Start date: ${fmtFull(rangeStart)}`;
  } else {
    const lo = rangeStart < rangeEnd ? rangeStart : rangeEnd;
    const hi = rangeStart < rangeEnd ? rangeEnd : rangeStart;
    panelHead.textContent = `${fmtFull(lo)} – ${fmtFull(hi)} · ${dayCount(lo,hi)} day${dayCount(lo,hi)>1?'s':''} selected`;
  }

  hintText.textContent = picking==='start' ? 'Pick a start date' : 'Pick an end date, or click again to reset';

  monthsRow.querySelectorAll('.day[data-y]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const dt = new Date(+el.dataset.y, +el.dataset.m, +el.dataset.d);
      if(picking === 'start'){
        rangeStart = dt; rangeEnd = dt; picking = 'end';
      } else {
        if(dt < rangeStart){ rangeEnd = rangeStart; rangeStart = dt; }
        else { rangeEnd = dt; }
        picking = 'start';
      }
      render();
    });
    el.addEventListener('mouseenter', ()=>{
      if(picking==='end'){
        hoverDate = new Date(+el.dataset.y, +el.dataset.m, +el.dataset.d);
        render();
      }
    });
  });

  monthsRow.querySelectorAll('.navbtn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const view = el.dataset.side==='left' ? leftView : rightView;
      const dir = el.dataset.nav==='prev' ? -1 : 1;
      view.m += dir;
      if(view.m<0){ view.m=11; view.y-=1; }
      if(view.m>11){ view.m=0; view.y+=1; }
      render();
    });
  });
}

setActiveTab(picker.querySelector('[data-range="ytd"]'));
applyQuickRange('ytd');
window.addEventListener('resize', ()=> {
  const active = picker.querySelector('button.active');
  if(active) moveIndicator(active);
});
</script>
</body>
</html>
